openapi: 3.0.3
info:
  title: Regula External Services Academic Contract
  version: 1.0.0
  description: Contrato sintético para demostrar integraciones externas sin datos reales.
servers:
  - url: https://mock-api:8443
security:
  - ApiKey: []
paths:
  /api/v1/identidades/{documento}:
    get:
      operationId: obtenerIdentidad
      parameters:
        - $ref: '#/components/parameters/Documento'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Identidad sintética
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Identidad' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TransientError' }
        '500': { $ref: '#/components/responses/TransientError' }
        '503': { $ref: '#/components/responses/TransientError' }
  /api/v1/sanciones/{documento}:
    get:
      operationId: consultarSanciones
      parameters:
        - $ref: '#/components/parameters/Documento'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Screening sintético de sanciones
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sanciones' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TransientError' }
        '500': { $ref: '#/components/responses/TransientError' }
        '503': { $ref: '#/components/responses/TransientError' }
  /api/v1/personas-expuestas/{documento}:
    get:
      operationId: consultarPersonaExpuesta
      parameters:
        - $ref: '#/components/parameters/Documento'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Screening PEP sintético
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonaExpuesta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TransientError' }
        '500': { $ref: '#/components/responses/TransientError' }
        '503': { $ref: '#/components/responses/TransientError' }
  /api/v1/clientes/{documento}/perfil:
    get:
      operationId: obtenerPerfilCliente
      parameters:
        - $ref: '#/components/parameters/Documento'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Perfil KYC sintetico enriquecido
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerfilCliente' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TransientError' }
        '500': { $ref: '#/components/responses/TransientError' }
        '503': { $ref: '#/components/responses/TransientError' }
  /api/v1/clientes/{documento}/documentos:
    get:
      operationId: obtenerDocumentosCliente
      parameters:
        - $ref: '#/components/parameters/Documento'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Metadata sintetica de documentos
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentosCliente' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TransientError' }
        '500': { $ref: '#/components/responses/TransientError' }
        '503': { $ref: '#/components/responses/TransientError' }
  /api/v1/clientes/{documento}/historial-transaccional:
    get:
      operationId: obtenerHistorialTransaccional
      parameters:
        - $ref: '#/components/parameters/Documento'
        - $ref: '#/components/parameters/CorrelationId'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 15 }
      responses:
        '200':
          description: Historial transaccional sintetico
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistorialTransaccional' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TransientError' }
        '500': { $ref: '#/components/responses/TransientError' }
        '503': { $ref: '#/components/responses/TransientError' }
  /api/v1/screening-listas/{documento}:
    get:
      operationId: consultarScreeningListas
      parameters:
        - $ref: '#/components/parameters/Documento'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Screening sintetico en listas ampliadas
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningListas' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TransientError' }
        '500': { $ref: '#/components/responses/TransientError' }
        '503': { $ref: '#/components/responses/TransientError' }
  /api/v1/riesgo-pais/{codigoIso}:
    get:
      operationId: consultarRiesgoPais
      parameters:
        - name: codigoIso
          in: path
          required: true
          schema: { type: string, minLength: 2, maxLength: 2 }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Riesgo pais sintetico
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiesgoPais' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TransientError' }
        '500': { $ref: '#/components/responses/TransientError' }
        '503': { $ref: '#/components/responses/TransientError' }
  /api/v1/beneficiario-final/{ruc}:
    get:
      operationId: consultarBeneficiarioFinal
      parameters:
        - name: ruc
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 30 }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Beneficiario final sintetico
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeneficiarioFinal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TransientError' }
        '500': { $ref: '#/components/responses/TransientError' }
        '503': { $ref: '#/components/responses/TransientError' }
  /api/v1/proveedores/estado:
    get:
      operationId: consultarEstadoProveedores
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Estado sintetico de proveedores
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoProveedores' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/licencias/validar:
    post:
      operationId: validarLicencia
      description: Validacion simulada de licencia para el control plane. Respuesta no criptografica.
      security:
        - ApiKey: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidacionLicenciaRequest' }
      responses:
        '200':
          description: Resultado sintetico de validacion de licencia
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidacionLicenciaResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    Documento:
      name: documento
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 30 }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
  headers:
    CorrelationId:
      schema: { type: string, format: uuid }
  schemas:
    Identidad:
      type: object
      required: [nombreCompleto, estadoDocumento, antecedentes]
      properties:
        nombreCompleto: { type: string, example: Persona Sintética }
        estadoDocumento: { type: string, enum: [ACTIVO, INACTIVO] }
        antecedentes: { type: boolean }
    Sanciones:
      type: object
      required: [sancionado, fuente]
      properties:
        sancionado: { type: boolean }
        fuente: { type: string, example: BCP_SIMULADO }
    PersonaExpuesta:
      type: object
      required: [pep, nivelExposicion]
      properties:
        pep: { type: boolean }
        nivelExposicion: { type: string, enum: [NINGUNO, MEDIO, ALTO] }
    PerfilCliente:
      type: object
      required: [documentoHashReferencia, estadoApi, nivelRiesgo, personal, laboral, academico, familiar, judicialRegulatorio]
      additionalProperties: true
      properties:
        documentoHashReferencia: { type: string }
        estadoApi: { type: string }
        nivelRiesgo: { type: string, enum: [BAJO, MEDIO, ALTO, CRITICO] }
        personal:
          type: object
          required: [nombreCompleto, tipoDocumento, documentoEnmascarado, fechaNacimiento, fechaEmisionDocumento, fechaExpiracionDocumento, paisEmisionDocumento, paisResidencia, paisNacionalidad, ciudadResidencia, departamentoResidencia, direccionResidencia, telefonoFijoEnmascarado, telefonoMovilEnmascarado, email, edad]
          additionalProperties: true
          properties:
            nombreCompleto: { type: string }
            tipoDocumento: { type: string, example: CI_PY }
            documentoEnmascarado: { type: string }
            fechaNacimiento: { type: string, format: date }
            fechaEmisionDocumento: { type: string, format: date }
            fechaExpiracionDocumento: { type: string, format: date }
            paisEmisionDocumento: { type: string, example: PY }
            paisResidencia: { type: string, example: PY }
            paisNacionalidad: { type: string, example: PY }
            ciudadResidencia: { type: string }
            departamentoResidencia: { type: string }
            direccionResidencia: { type: string }
            telefonoFijoEnmascarado: { type: string }
            telefonoMovilEnmascarado: { type: string }
            email: { type: string, format: email }
            edad: { type: integer }
            fotoDocumentoFrenteReferencia: { type: string }
            fotoDocumentoDorsoReferencia: { type: string }
            fotoPerfilReferencia: { type: string }
        laboral:
          type: object
          required: [lugarTrabajo, direccionTrabajo, contactoCorporativo, ocupacion, rango, antiguedad, ingresoMensualEstimado]
          additionalProperties: true
          properties:
            lugarTrabajo: { type: string }
            direccionTrabajo: { type: string }
            contactoCorporativo: { type: string }
            ocupacion: { type: string }
            rango: { type: string }
            antiguedad: { type: string }
            ingresoMensualEstimado: { type: number }
        academico:
          type: object
          required: [nivelEstudios, titulosObtenidos, institucionEducativa, periodoCursada, calificacionesExpedientes, logrosDestacados, certificacionesCursos]
          additionalProperties: true
          properties:
            nivelEstudios: { type: string }
            titulosObtenidos:
              type: array
              items: { type: string }
            institucionEducativa: { type: string }
            periodoCursada: { type: string }
            calificacionesExpedientes: { type: string }
            logrosDestacados:
              type: array
              items: { type: string }
            certificacionesCursos:
              type: array
              items: { type: string }
        familiar:
          type: object
          required: [estadoCivil, parentescosDirectos, contactoEmergencia, direccionContactoEmergencia]
          additionalProperties: true
          properties:
            estadoCivil: { type: string }
            parentescosDirectos:
              type: array
              items: { type: object, additionalProperties: true }
            contactoEmergencia: { type: string }
            direccionContactoEmergencia: { type: string }
        judicialRegulatorio:
          type: object
          required: [antecedentesPenales, procesosJudicialesActivos, ordenesRequerimientos, historialLitigios, pep, sancionado, nivelRiesgo, hallazgos]
          additionalProperties: true
          properties:
            antecedentesPenales: { type: boolean }
            procesosJudicialesActivos: { type: string }
            ordenesRequerimientos: { type: string }
            historialLitigios: { type: string }
            pep: { type: boolean }
            sancionado: { type: boolean }
            nivelRiesgo: { type: string }
            hallazgos:
              type: array
              items: { type: string }
    DocumentosCliente:
      type: object
      required: [documentoHashReferencia, documentos, mensaje]
      properties:
        documentoHashReferencia: { type: string }
        documentos:
          type: array
          items:
            type: object
            required: [tipo, estado, referencia]
            additionalProperties: true
            properties:
              tipo: { type: string }
              estado: { type: string }
              frenteDisponible: { type: boolean }
              dorsoDisponible: { type: boolean }
              referencia: { type: string }
        mensaje: { type: string }
    HistorialTransaccional:
      type: object
      required: [documentoHashReferencia, cantidad, transacciones]
      properties:
        documentoHashReferencia: { type: string }
        cantidad: { type: integer }
        transacciones:
          type: array
          items: { type: object, additionalProperties: true }
    ScreeningListas:
      type: object
      required: [documentoHashReferencia, resultado, nivelRiesgo, hallazgos, fuentes, mensaje]
      properties:
        documentoHashReferencia: { type: string }
        resultado: { type: string, enum: [SIN_COINCIDENCIAS, CON_COINCIDENCIAS] }
        nivelRiesgo: { type: string }
        hallazgos:
          type: array
          items: { type: string }
        fuentes:
          type: array
          items: { type: string }
        mensaje: { type: string }
    RiesgoPais:
      type: object
      required: [codigoIso, categoria, nivelRiesgo, fuentes, observacion]
      properties:
        codigoIso: { type: string }
        categoria: { type: string }
        nivelRiesgo: { type: string }
        fuentes:
          type: array
          items: { type: string }
        observacion: { type: string }
    BeneficiarioFinal:
      type: object
      required: [rucHashReferencia, razonSocial, beneficiarios, fuente, mensaje]
      properties:
        rucHashReferencia: { type: string }
        razonSocial: { type: string }
        beneficiarios:
          type: array
          items: { type: object, additionalProperties: true }
        fuente: { type: string }
        mensaje: { type: string }
    EstadoProveedores:
      type: object
      additionalProperties: true
    ValidacionLicenciaRequest:
      type: object
      required: [instalacionId, fingerprintHash]
      properties:
        instalacionId: { type: string, format: uuid }
        fingerprintHash: { type: string }
    ValidacionLicenciaResponse:
      type: object
      required: [instalacionIdHash, fingerprintMatch, estado, plan, vence, mensaje]
      properties:
        instalacionIdHash: { type: string }
        fingerprintMatch: { type: boolean }
        estado: { type: string, enum: [VALIDO, NO_VALIDO] }
        plan: { type: string }
        vence: { type: string, format: date-time }
        mensaje: { type: string }
    Error:
      type: object
      required: [codigo, mensaje, correlationId]
      properties:
        codigo: { type: string }
        mensaje: { type: string }
        correlationId: { type: string }
  responses:
    Unauthorized:
      description: API Key ausente o inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Documento sintético no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TransientError:
      description: Error transitorio simulado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
